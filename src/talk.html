<style id="lt-theme">/* Lattice base styles. Themes set the custom properties used here. */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--lt-backdrop);color:var(--lt-ink);overflow:hidden}
body{font-family:var(--lt-font-body);-webkit-font-smoothing:antialiased}

#lt-stage{position:relative;flex:1;overflow:hidden}
#lt-viewport{position:absolute;left:0;top:0;width:var(--lt-w);height:var(--lt-h);transform-origin:0 0;
  background:var(--lt-bg);overflow:hidden;box-shadow:0 0 0 1px var(--lt-rule)}
html:not(.lt-ready) #lt-viewport{visibility:hidden}

/* slides */
.lt-slide{position:absolute;inset:0;padding:54px 72px 70px;display:flex;flex-direction:column;
  font-size:28px;line-height:1.45}
.lt-slide[hidden]{display:none}
.lt-head{flex:none;margin-bottom:22px}
.lt-title{font-family:var(--lt-font-head);font-weight:650;font-size:46px;line-height:1.12;margin:0;
  letter-spacing:-.01em;color:var(--lt-ink)}
.lt-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px}
.lt-body>*{margin:0}
.lt-body p{margin:0}
.lt-body ul,.lt-body ol{margin:0;padding-left:1.1em}
.lt-body li{margin:.18em 0}
.lt-body li::marker{color:var(--lt-accent)}
.lt-body h2{font-family:var(--lt-font-head);font-size:34px;font-weight:600;margin:0}
.lt-body h3{font-family:var(--lt-font-head);font-size:28px;font-weight:600;margin:0;color:var(--lt-muted)}
.lt-body a{color:var(--lt-accent);text-decoration-thickness:2px;text-underline-offset:4px}
.lt-body img{max-width:100%;max-height:100%;object-fit:contain}
.lt-body blockquote{margin:0;padding-left:24px;border-left:4px solid var(--lt-rule);color:var(--lt-muted)}
.lt-body table{border-collapse:collapse;font-size:24px}
.lt-body th,.lt-body td{padding:8px 16px;border-bottom:1px solid var(--lt-rule);text-align:left}
.lt-body th{color:var(--lt-muted);font-weight:600}
.lt-body code{font-family:var(--lt-font-code);font-size:.86em;background:var(--lt-panel);padding:.08em .3em;border-radius:4px}
.lt-body hr{border:0;border-top:2px solid var(--lt-rule);width:100%}
.lt-muted{color:var(--lt-muted)}
kbd{font-family:var(--lt-font-code);font-size:.72em;display:inline-block;min-width:1.6em;padding:.05em .4em;
  border:1.5px solid currentColor;border-radius:5px;text-align:center;line-height:1.3;opacity:.85}

/* layouts and helper classes */
.layout-title{justify-content:center;padding-left:110px}
.layout-title .lt-title{font-size:72px;max-width:18ch}
.layout-title .lt-body{flex:none;margin-top:18px;color:var(--lt-muted);font-size:30px}
.lt-slide.center .lt-body{justify-content:center;align-items:center;text-align:center}
.lt-slide.fullbleed{padding:0}

/* detour slides carry a side rail: you are off the main road */
.lt-slide.lt-in-detour::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--lt-detour)}

/* reveal */
[data-lt-reveal]{transition:opacity .25s ease}
.lt-hidden{opacity:0;visibility:hidden}

/* columns and callouts */
.lt-columns{display:flex;gap:40px;min-height:0;flex:1}
.lt-column{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
/* a table never spills into the next column: if it cannot fit, it scrolls inside its own */
.lt-column table{display:block;max-width:100%;overflow-x:auto}
.lt-callout{padding:16px 22px;border-radius:10px;background:var(--lt-panel);border-left:6px solid var(--lt-accent)}

/* detour badges and branch menus */

  color:var(--lt-detour-ink);background:transparent;border:2px dashed var(--lt-detour);border-radius:999px;
  padding:6px 18px 6px 12px;cursor:pointer}

.lt-branch{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.lt-branch-opt{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:18px;text-align:left;
  font:inherit;font-size:28px;color:var(--lt-ink);background:var(--lt-panel);border:0;border-radius:10px;
  padding:14px 22px;cursor:pointer;border-left:6px solid var(--lt-accent)}
.lt-branch-opt:hover,.lt-branch-opt:focus-visible{background:var(--lt-accent-soft);outline:none}
.lt-branch-opt kbd{color:var(--lt-accent)}

.lt-branch-cards{flex-direction:row}

.lt-branch-cards .lt-branch-desc{grid-column:1}

.lt-branch-cards .lt-branch-opt{align-content:start}

/* components */
.lt-c{min-height:0;display:flex;flex-direction:column}
.lt-code{background:var(--lt-code-bg);border-radius:10px;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.lt-code-title{font-family:var(--lt-font-code);font-size:16px;color:var(--lt-muted);padding:10px 20px 0}
.lt-code pre{margin:0;padding:16px 0;overflow:auto;font-family:var(--lt-font-code);font-size:19px;line-height:1.5;
  background:transparent !important}
.lt-code code{background:none;padding:0;font-size:inherit}

.lt-has-hl .lt-line{opacity:.38}

.lt-column .lt-code pre{font-size:16.5px}
.lt-ln{display:inline-block;width:2.6em;margin-left:-.4em;color:var(--lt-muted);opacity:.6;user-select:none}

.lt-plot,.lt-dot{height:100%;display:flex;justify-content:center;color:var(--lt-ink)}
.lt-dot svg text{fill:currentColor}
.lt-plot svg,.lt-dot svg{height:100%;width:auto;max-width:100%;display:block}
.lt-plot-vega,.lt-plot-plotly{height:auto;align-items:center}
.lt-plot-vega svg{height:auto}
.lt-diff-sign{display:inline-block;width:1.4em;color:var(--lt-muted);user-select:none}
.lt-diff-add{background:var(--lt-add-bg)}
.lt-diff-add .lt-diff-sign{color:var(--lt-good)}
.lt-diff-del{background:var(--lt-del-bg);text-decoration:line-through;text-decoration-color:var(--lt-warn);opacity:.75}

.lt-diff-stat{float:right;margin-left:20px}
.lt-diff-pane[hidden]{display:none}
.lt-diff-pane{display:flex;flex-direction:column;min-height:0}
.lt-math-block{text-align:center;font-size:1.1em}
.lt-error{color:var(--lt-warn);font-family:var(--lt-font-code);font-size:18px;border:2px dashed var(--lt-warn);padding:12px}

/* graph, array, tree and grid animations */
.lt-graph-anim,.lt-array-anim,.lt-tree-anim,.lt-grid-anim{container-type:inline-size;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.lt-ga-main,.lt-aa-main{display:flex;gap:28px;min-height:0;flex:1;align-items:center}

@container (max-width: 760px){

}
.lt-ga-caption{font-size:22px;color:var(--lt-muted);min-height:1.5em;font-style:italic}
.lt-ga-panel{flex:none;display:flex;flex-direction:column;gap:14px;font-size:19px;max-width:40%}
.lt-pv-name{font-family:var(--lt-font-code);font-size:15px;color:var(--lt-muted);margin-bottom:4px}
.lt-pv-map{border-collapse:collapse;font-family:var(--lt-font-code);font-size:18px}
.lt-pv-map th{font-weight:600;color:var(--lt-muted);padding:2px 10px;border-bottom:1px solid var(--lt-rule)}
.lt-pv-map td{padding:4px 10px;text-align:center}
.lt-pv-list{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--lt-font-code);font-size:18px}
.lt-pv-list span{background:var(--lt-panel);padding:2px 10px;border-radius:6px}
.lt-pv-scalar{font-family:var(--lt-font-code)}

.lt-edge path{fill:none;stroke:var(--lt-edge);stroke-width:2.2}
.lt-edge-label{font-family:var(--lt-font-code);font-size:13px;fill:var(--lt-muted);paint-order:stroke;stroke:var(--lt-bg);stroke-width:5px}
.lt-node circle{fill:var(--lt-bg);stroke:var(--lt-edge);stroke-width:2.4}
.lt-node-name{font-family:var(--lt-font-head);font-weight:650;font-size:15px;fill:var(--lt-ink)}
.lt-node-badge{font-family:var(--lt-font-code);font-size:13px;font-weight:600;fill:var(--lt-accent)}
.lt-arrow path{fill:var(--lt-edge)}
.lt-animate .lt-node circle,.lt-animate .lt-edge path,.lt-animate .lt-node-name{transition:fill .3s,stroke .3s,stroke-width .3s,opacity .3s}
.lt-node.st-active circle{fill:var(--lt-active);stroke:var(--lt-active)}

.lt-node.st-visited circle,.lt-node.st-done circle{fill:var(--lt-accent);stroke:var(--lt-accent)}
.lt-node.st-visited .lt-node-name,.lt-node.st-done .lt-node-name{fill:var(--lt-on-strong)}
.lt-node.st-path circle{fill:var(--lt-good);stroke:var(--lt-good)}
.lt-node.st-path .lt-node-name{fill:var(--lt-on-strong)}

.lt-aa-row,.lt-aa-ptr{display:grid;gap:8px}
.lt-cell{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:250px;text-align:center}
.lt-bar{background:var(--lt-cell);border-radius:6px 6px 2px 2px;margin:0 4px}

.lt-aa-ptr span::before{content:"\25B2 ";font-size:11px}

/* trees: nodes and edges reuse the graph styles; nodes leaving the tree fade out */
.lt-ta-out{opacity:0;pointer-events:none}

.lt-ta-badge{font-size:12px;paint-order:stroke;stroke:var(--lt-bg);stroke-width:4px}

/* grids: mazes and dynamic programming tables */
.lt-gc rect{fill:var(--lt-bg);stroke:var(--lt-rule);stroke-width:1.5}

.lt-gc.st-visited rect{fill:var(--lt-accent-soft)}
.lt-gc.st-done rect{fill:var(--lt-accent);stroke:var(--lt-accent)}

.lt-gc.st-path rect{fill:var(--lt-good);stroke:var(--lt-good)}
.lt-gc.st-path text{fill:var(--lt-on-strong)}
.lt-gc.st-wall rect{fill:var(--lt-wall);stroke:var(--lt-wall)}
.lt-gc.st-wall text{fill:var(--lt-bg)}
.lt-gc.st-start rect{stroke:var(--lt-accent);stroke-width:4}
.lt-gc.st-goal rect{stroke:var(--lt-good);stroke-width:4}
.lt-gc.st-error rect{fill:var(--lt-warn);stroke:var(--lt-warn)}
.lt-gc.st-dim{opacity:.35}
.lt-gr-heads text{font-family:var(--lt-font-code);fill:var(--lt-muted)}
.lt-gr-arrow path{fill:none;stroke:var(--lt-edge);stroke-width:2.2}
.lt-gr-head path{fill:var(--lt-edge)}
.lt-gr-arrow.st-active path{stroke:var(--lt-active);stroke-width:3}
.lt-gr-head.st-active path{fill:var(--lt-active)}
.lt-gr-arrow.st-path path{stroke:var(--lt-ink);stroke-width:3.4}
.lt-gr-head.st-path path{fill:var(--lt-ink)}
.lt-gr-arrow.st-dim{opacity:.3}
.lt-gr-ptr rect{fill:none;stroke:var(--lt-accent);stroke-width:3}
.lt-gr-ptr text{font-family:var(--lt-font-code);font-size:.5em;font-weight:700;fill:var(--lt-accent)}

/* basic block versioning: versions of a CFG, in the style of the thesis figures */
.lt-bbv-anim{container-type:inline-size;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
/* the panel keeps a fixed width and the drawing its height, so that the drawing does not rescale as the
   queue grows and shrinks or as the caption wraps; the caption fits in the space left (bbv.js shrinks its text) */
.lt-bbv-anim .lt-ga-panel{flex:0 0 clamp(150px,22%,260px);max-width:none}
.lt-c-bbv-anim,.lt-c-bbv-cfg,.lt-c-abstract-interp-anim{flex:1 1 auto}
.lt-bbv-anim .lt-ga-main{flex:none}
.lt-bbv-anim .lt-ga-caption{flex:1 1 auto;min-height:33px;overflow:hidden}
.lt-bbv-header{font-family:var(--lt-font-head);font-size:15px;font-weight:600;fill:var(--lt-muted)}
.lt-bbv-node rect{fill:var(--lt-bg);stroke:var(--lt-edge);stroke-width:1.6}
.lt-bbv-node.has-origin rect{fill:color-mix(in srgb,var(--origin) 16%,var(--lt-bg))}
.lt-bbv-node.st-queued rect{stroke-dasharray:6 4}
.lt-bbv-node.mk-active rect{stroke:var(--lt-active);stroke-width:3.5}
.lt-bbv-node.mk-new rect{stroke:var(--lt-accent);stroke-width:3}
.lt-bbv-node.mk-back rect{stroke:var(--lt-accent);stroke-width:3;stroke-dasharray:2 3}
.lt-bbv-node.mk-merge rect{stroke:var(--lt-warn);stroke-width:3.5}
.lt-bbv-node.mk-merged rect{stroke:var(--lt-good);stroke-width:3.5}
.lt-bbv-node.mk-gone{opacity:.22}
.lt-bbv-node.mk-changed rect{stroke:var(--lt-accent);stroke-width:3}
.lt-bbv-node.mk-widened rect{stroke:var(--lt-warn);stroke-width:3.5}
.lt-bbv-node.st-dead{opacity:.4}
.lt-bbv-node.st-dead rect{stroke-dasharray:6 4}
.lt-bbv-node.lt-gone{opacity:0;pointer-events:none}
.lt-bbv-label{font-family:var(--lt-font-head);font-weight:650;font-size:15px;fill:var(--lt-ink)}
.lt-bbv-star{fill:var(--lt-accent);font-weight:700}
.lt-bbv-ctx{font-family:var(--lt-font-code);font-size:12px;font-style:italic;fill:var(--lt-muted)}
.lt-bbv-code{font-family:var(--lt-font-code);font-size:12.5px;fill:var(--lt-ink);white-space:pre}
.lt-bbv-removed{text-decoration:line-through;fill:var(--lt-muted)}
.lt-bbv-ellipsis{fill:var(--lt-muted)}
.lt-bbv-edge path{fill:none;stroke:var(--lt-edge);stroke-width:1.8}
.lt-bbv-edge.k-return path{stroke-dasharray:6 4}
.lt-bbv-edge.k-call path{stroke-dasharray:2 4;opacity:.7}
.lt-bbv-edge.st-new path{stroke:var(--lt-accent);stroke-width:3}
.lt-bbv-edge.st-active path{stroke:var(--lt-active);stroke-width:3}
.lt-bbv-edge.st-gone{opacity:.22}
.lt-bbv-edge.lt-gone{opacity:0}
.lt-bbv-edge-label{font-family:var(--lt-font-code);font-size:12px;fill:var(--lt-muted);paint-order:stroke;stroke:var(--lt-bg);stroke-width:5px}
.lt-animate .lt-bbv-node rect,.lt-animate .lt-bbv-node,.lt-animate .lt-bbv-edge,.lt-animate .lt-bbv-edge path{transition:stroke .3s,stroke-width .3s,opacity .3s,fill .3s}

/* HUD: where you are in the graph */
#lt-hud{position:absolute;left:0;right:0;bottom:0;height:46px;padding:0 28px 0 72px;display:flex;align-items:center;
  justify-content:space-between;gap:24px;font-size:16px;color:var(--lt-muted);border-top:1px solid var(--lt-rule);
  background:var(--lt-bg)}
#lt-crumbs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#lt-crumbs b{color:var(--lt-ink);font-weight:600}
.lt-sep{margin:0 10px;color:var(--lt-detour-ink)}
#lt-progress{display:flex;align-items:center;gap:22px;white-space:nowrap}
.lt-hint{display:inline-flex;align-items:center;gap:8px}
.lt-hint kbd{font-size:13px}
.lt-where{font-family:var(--lt-font-code);font-size:15px}
.lt-steps{display:inline-flex;gap:5px}
.lt-steps i{width:7px;height:7px;border-radius:50%;background:var(--lt-rule)}
.lt-steps i.on{background:var(--lt-accent)}
#lt-flash{position:absolute;left:50%;bottom:66px;transform:translate(-50%,8px);background:var(--lt-ink);color:var(--lt-bg);
  padding:8px 18px;border-radius:8px;font-size:18px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#lt-flash.on{opacity:1;transform:translate(-50%,0)}

/* overlays */
#lt-overlay{position:fixed;inset:0;background:var(--lt-scrim);display:flex;align-items:flex-start;justify-content:center;
  padding:6vh 20px;z-index:10;overflow:auto}
#lt-overlay[hidden]{display:none}
.lt-panel{background:var(--lt-bg);color:var(--lt-ink);border-radius:14px;padding:26px 30px;width:min(760px,100%);
  box-shadow:0 20px 60px rgba(0,0,0,.25);font-size:16px}
.lt-panel h2{margin:0 0 12px;font-family:var(--lt-font-head);font-size:22px}
.lt-panel h3{margin:18px 0 8px;font-size:15px;color:var(--lt-muted);font-weight:600}
.lt-overview{width:min(1200px,100%)}
.lt-ov-map{overflow:auto;max-height:46vh;margin:0 0 16px;padding:8px;border-radius:10px;background:var(--lt-panel)}
.lt-ov-map svg{display:block}
.lt-ov-edges path{fill:none;stroke:var(--lt-edge);stroke-width:1.3}
.lt-ov-edges path.k-branch{stroke:var(--lt-accent)}
.lt-ov-edges path.k-detour{stroke:var(--lt-detour);stroke-dasharray:4 3}
.lt-ov-edges path.k-link{stroke-dasharray:1.5 3}
#lt-ov-arrow path{fill:var(--lt-edge)}
.lt-ovn{cursor:pointer}
.lt-ovn rect{fill:var(--lt-bg);stroke:var(--lt-edge);stroke-width:1.2}
.lt-ovn text{font-size:11px;fill:var(--lt-ink);text-anchor:middle;dominant-baseline:central;font-family:var(--lt-font-body)}
.lt-ovn.detour rect{stroke:var(--lt-detour);stroke-dasharray:4 2}
.lt-ovn.offpath rect{stroke-dasharray:2 3}
.lt-ovn.visited rect{fill:var(--lt-accent-soft)}
.lt-ovn.current rect{fill:var(--lt-accent);stroke:var(--lt-accent)}
.lt-ovn.current text{fill:var(--lt-on-strong);font-weight:600}
.lt-ovn:hover rect{stroke:var(--lt-accent);stroke-width:2}
.lt-overview ol,.lt-overview ul{list-style:none;margin:0;padding:0}
.lt-ov-main>li{margin:2px 0}
.lt-ov-detour,.lt-ov-branch{margin-left:26px !important;padding-left:14px !important;border-left:2px dashed var(--lt-detour) !important}
.lt-ov-branch{border-left-style:solid !important;border-left-color:var(--lt-accent) !important}
.lt-ov-label{color:var(--lt-muted);font-size:14px;padding:4px 0}
.lt-ov-item{font:inherit;color:inherit;background:none;border:0;padding:4px 10px;border-radius:6px;cursor:pointer;text-align:left;width:100%}
.lt-ov-item:hover,.lt-ov-item:focus-visible{background:var(--lt-panel);outline:none}
.lt-ov-item.current{background:var(--lt-accent-soft);font-weight:600}
.lt-goto input{width:100%;font:inherit;font-size:20px;padding:10px 14px;border:2px solid var(--lt-rule);border-radius:8px;
  background:var(--lt-bg);color:var(--lt-ink)}
.lt-goto input:focus{outline:none;border-color:var(--lt-accent)}
.lt-goto ul{list-style:none;margin:10px 0 0;padding:0}
.lt-goto button{display:flex;justify-content:space-between;width:100%;font:inherit;color:inherit;background:none;border:0;
  padding:8px 12px;border-radius:6px;cursor:pointer;text-align:left}
.lt-goto li.sel button,.lt-goto button:hover{background:var(--lt-accent-soft)}
.lt-goto small{color:var(--lt-muted);font-family:var(--lt-font-code)}

/* presenter view */
.lt-presenter #lt-stage{flex:0 0 64%}
#lt-presenter-panel{flex:1;overflow:auto;padding:24px 28px;background:var(--lt-panel);color:var(--lt-ink);font-size:17px;
  border-left:1px solid var(--lt-rule)}
#lt-presenter-panel[hidden]{display:none}
#lt-presenter-panel h3{font-size:14px;color:var(--lt-muted);margin:22px 0 8px;font-weight:600}
.lt-pp-top{display:flex;gap:18px;align-items:baseline;justify-content:space-between}
.lt-pp-timer{font-family:var(--lt-font-code);font-size:30px;font-weight:600;cursor:pointer}
.lt-pp-moves{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.lt-pp-moves kbd{margin-right:10px;color:var(--lt-accent)}
.lt-pp-notes{font-size:19px;line-height:1.5}
.lt-pp-notes a{color:var(--lt-accent)}
.lt-pp-scrub{display:flex;align-items:center;gap:14px;margin-top:18px}
.lt-pp-scrub[hidden]{display:none}
.lt-pp-scrub input{flex:1;min-width:0;accent-color:var(--lt-accent);cursor:pointer}
.lt-pp-scrub-label{font-family:var(--lt-font-code);font-size:15px;color:var(--lt-muted);min-width:7ch;text-align:right}
.lt-pp-next-label{font-weight:400}
.lt-pp-next{position:relative}
.lt-pp-preview{display:block;width:100%;border:0;border-radius:8px;background:var(--lt-backdrop);pointer-events:none}
.lt-pp-next-none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--lt-muted);
  border:2px dashed var(--lt-rule);border-radius:8px}
.lt-pp-next-none[hidden]{display:none}
/* the preview pane is a passive copy of the deck */
.lt-preview #lt-hud,.lt-preview #lt-flash{display:none}
.lt-preview #lt-viewport{box-shadow:none}

/* print mode (PDF export): static copies of each page, one per PDF page */
@page{margin:0}
html.lt-print,html.lt-print body{overflow:visible;height:auto}
html.lt-print *{transition:none !important;animation:none !important}
html.lt-print #lt-hud{display:none}
#lt-root[hidden]{display:none}
.lt-print-page{position:relative;width:var(--lt-w);height:var(--lt-h);overflow:hidden;background:var(--lt-bg);
  break-after:page;page-break-after:always}
.lt-print-page:last-child{break-after:auto;page-break-after:auto}
.lt-print-page .lt-slide{position:absolute;inset:0}
.lt-print-foot{position:absolute;left:0;right:0;bottom:0;height:46px;padding:0 28px 0 72px;display:flex;align-items:center;
  justify-content:space-between;gap:24px;font-size:16px;color:var(--lt-muted);border-top:1px solid var(--lt-rule);white-space:nowrap}
.lt-print-foot span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.lt-print-foot a{color:var(--lt-accent)}
.lt-print-foot b{font-family:var(--lt-font-code);font-weight:600;color:var(--lt-ink);margin-left:22px}
.lt-print-ref{font-family:var(--lt-font-code);font-size:.8em;color:var(--lt-muted);margin-left:.6em}
a.lt-detour-badge,a.lt-branch-opt{text-decoration:none}
.lt-print-nolink{text-decoration:none;color:inherit}

/* transitions */
@keyframes lt-slide-in{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes lt-slide-back{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes lt-zoom-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes lt-zoom-out{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
@keyframes lt-fade{from{opacity:0}to{opacity:1}}
.lt-anim-slide{animation:lt-slide-in .28s ease-out}
.lt-anim-slide-back{animation:lt-slide-back .28s ease-out}
.lt-anim-zoom-in{animation:lt-zoom-in .3s ease-out}
.lt-anim-zoom-out{animation:lt-zoom-out .3s ease-out}
.lt-anim-fade{animation:lt-fade .25s ease-out}
@media (prefers-reduced-motion:reduce){.lt-slide{animation:none !important}}

// Lattice runtime: navigation state machine (spec section 7) and component host (spec section 10).
const Lattice = (() => {
  "use strict";
  const registry = {};
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  let deck = null;
  let nav = null; // { cur: {slide, step}, H: [{slide, step, kind}], tour: string|null }
  const sections = {};
  const mounted = {}; // instanceId -> { ctl, inst, el }
  const instancesBySlide = {};
  const resizeCallbacks = [];
  const dataStore = {}; // instanceId -> data fetched in directory mode
  let presenter = false;
  let passive = false; // preview (the presenter's "next" pane) and print: no input, history, storage or sync
  let printing = false;
  let previewFrame = null;
  let previewReady = false;
  let channel = null;
  let storageKey = "";
  let hudTimer = null;
  let timerStart = Date.now();

  // ------------------------------------------------------------------ registry
  function component(name, controller) {
    registry[name] = controller;
  }

  // ------------------------------------------------------------------ frames (spec 9.3)
  function applyDelta(state, delta) {
    const out = Object.assign({}, state);
    for (const [k, v] of Object.entries(delta || {})) {
      if (v === null) delete out[k];
      else if (v && typeof v === "object" && !Array.isArray(v) && out[k] && typeof out[k] === "object" && !Array.isArray(out[k])) out[k] = applyDelta(out[k], v);
      else out[k] = v;
    }
    return out;
  }

  function frames(store) {
    if (!store) return { count: 0, at: () => ({}) };
    if (store.format === "full") return { count: store.count, at: (i) => store.frames[Math.max(0, Math.min(i, store.count - 1))] };
    const cache = new Map();
    return {
      count: store.count,
      at(i) {
        i = Math.max(0, Math.min(i, store.count - 1));
        if (cache.has(i)) return cache.get(i);
        const k = Math.floor(i / store.interval);
        let state = store.keyframes[k];
        for (let j = k * store.interval + 1; j <= i; j++) state = applyDelta(state, store.deltas[j]);
        if (cache.size > 64) cache.clear();
        cache.set(i, state);
        return state;
      },
    };
  }

  // ------------------------------------------------------------------ helpers
  const slide = (id) => deck.slides[id];
  const steps = (id) => slide(id).steps;
  const label = (id) => (slide(id) ? slide(id).label : id);
  const detourOf = (id) => {
    const s = slide(id);
    return s && s.scope !== "root" ? deck.detours[s.scope] : null;
  };
  function topExcursion() {
    for (let i = nav.H.length - 1; i >= 0; i--) if (nav.H[i].kind === "excursion") return i;
    return -1;
  }
  function resolveTarget(id) {
    if (deck.slides[id]) return id;
    if (deck.detours[id]) return deck.detours[id].entry;
    return null;
  }

  function push(kind) {
    nav.H.push({ slide: nav.cur.slide, step: nav.cur.step, kind });
  }
  function go(slideId, step, how) {
    const prev = Object.assign({}, nav.cur);
    nav.cur = { slide: slideId, step: Math.max(0, Math.min(step, steps(slideId) - 1)) };
    render(prev, how);
  }
  function tourSuccessor() {
    if (!nav.tour || !deck.tours[nav.tour]) return null;
    const list = deck.tours[nav.tour];
    const i = list.indexOf(nav.cur.slide);
    return i >= 0 && i + 1 < list.length ? list[i + 1] : null;
  }
  function nextTarget() {
    // What NEXT would do at the last step: { kind, slide } or null.
    const t = tourSuccessor();
    if (t) return { kind: "tour", slide: t };
    const n = slide(nav.cur.slide).next;
    if (n === "back") return { kind: "back", slide: returnTarget() };
    if (n && n.slide) return { kind: "next", slide: n.slide };
    return null;
  }
  function returnTarget() {
    const i = topExcursion();
    if (i >= 0) return nav.H[i].slide;
    const d = detourOf(nav.cur.slide);
    return d ? d.origin : null;
  }

    next() {
      const cur = nav.cur;
      if (cur.step < steps(cur.slide) - 1) return go(cur.slide, cur.step + 1, { kind: "step", dir: 1 });
      const t = tourSuccessor();
      if (t) { push("forward"); return go(t, 0, { kind: "next", dir: 1 }); }
      const n = slide(cur.slide).next;

      if (n && n.slide) { push("forward"); return go(n.slide, 0, { kind: "next", dir: 1 }); }

    prev() {
      const cur = nav.cur;
      if (cur.step > 0) return go(cur.slide, cur.step - 1, { kind: "step", dir: -1 });
      if (nav.H.length) {
        const e = nav.H.pop();
        return go(e.slide, e.step, { kind: e.kind === "excursion" ? "return" : "prev", dir: -1 });
      }
      flash("Start of history");
    },
    choose(key) {
      const s = slide(nav.cur.slide);
      const b = s.branches.find((o) => o.key === key);
      if (b) { push("forward"); return go(b.target, 0, { kind: "branch", dir: 1 }); }
      const dId = s.detours.find((id) => deck.detours[id].key === key);
      if (dId) return actions.enter(dId);
      return false;
    },
    down() {
      const s = slide(nav.cur.slide);
      if (s.detours.length) return actions.enter(s.detours[0]);
      flash("No detour here");
    },
    enter(detourId) {
      const d = deck.detours[detourId];
      if (!d || !d.entry) return;
      push("excursion");
      go(d.entry, 0, { kind: "detour", dir: 1 });
    },
    jump(target) {
      const t = resolveTarget(target);
      if (!t || t === nav.cur.slide) return;
      push("excursion");
      go(t, 0, { kind: "link", dir: 1 });
    },
    return() {
      const i = topExcursion();
      if (i >= 0) {
        const e = nav.H[i];
        nav.H = nav.H.slice(0, i);
        return go(e.slide, e.step, { kind: "return", dir: -1 });
      }
      const d = detourOf(nav.cur.slide);
      if (d) return go(d.origin, steps(d.origin) - 1, { kind: "return", dir: -1 });
      flash("Nothing to return to");
    },
    home() {
      nav.H = [];
      go(deck.start, 0, { kind: "link", dir: -1 });
    },
    tour() {
      const names = Object.keys(deck.tours);
      if (!names.length) return flash("No tours defined");
      const i = nav.tour ? names.indexOf(nav.tour) : -1;
      nav.tour = i + 1 < names.length ? names[i + 1] : null;
      flash(nav.tour ? `Tour: ${nav.tour}` : "Tour off");
      save();
      broadcast();
    },
    overview() { openOverview(); },
    goto() { openGoto(); },
    presenter() {
      if (presenter) return;
      const url = location.pathname + location.search + (location.search ? "&" : "?") + "presenter" + location.hash;
      window.open(url, "lattice-presenter");
    },
    "enter-detour"() { actions.down(); },
  };

  // ------------------------------------------------------------------ rendering
  function transitionFor(how, target) {
    if (!how || how.kind === "step" || how.kind === "sync" || how.kind === "scrub") return null;
    const back = (name) => (name === "zoom" ? "zoom-out" : name === "slide" ? "slide-back" : name);
    if (how.kind === "return") return "zoom-out";
    if (how.kind === "prev") return back(deck.transitions.next);
    const name = slide(target).transition || deck.transitions[how.kind] || deck.transitions.next;
    if (how.dir < 0) return back(name);
    return name === "zoom" ? "zoom-in" : name;
  }

  // Panel of variables shared by animation components: scalars, lists and maps.
  function renderPanel(el, panel, keys) {
    if (!el) return;
    const entries = Object.entries(panel || {}).filter(([k]) => !keys || keys.includes(k));
    if (keys) entries.sort((a, b) => keys.indexOf(a[0]) - keys.indexOf(b[0]));
    el.hidden = entries.length === 0;
    el.innerHTML = entries.map(([k, v]) => {
      let body;
      if (Array.isArray(v)) body = `<div class="lt-pv-list">${v.map((x) => `<span>${esc(x)}</span>`).join("") || '<span class="lt-muted">empty</span>'}</div>`;
      else if (v && typeof v === "object") body = `<table class="lt-pv-map"><tr>${Object.keys(v).map((x) => `<th>${esc(x)}</th>`).join("")}</tr><tr>${Object.values(v).map((x) => `<td>${esc(x)}</td>`).join("")}</tr></table>`;
      else body = `<div class="lt-pv-scalar">${esc(v)}</div>`;
      return `<div class="lt-pv"><div class="lt-pv-name">${esc(k)}</div>${body}</div>`;
    }).join("");
  }

  function mountSlide(id) {
    for (const instId of instancesBySlide[id] || []) {
      if (mounted[instId]) continue;
      const meta = deck.instances[instId];
      const ctl = registry[meta.component];
      if (!ctl || !(meta.data || meta.url)) continue; // static instances need no runtime
      const el = sections[id].querySelector(`[data-instance="${CSS.escape(instId)}"]`);
      if (!el) continue;
      let data = dataStore[instId];
      if (data === undefined) {
        const dataEl = meta.data ? document.getElementById(meta.data) : null;
        data = dataEl ? JSON.parse(dataEl.textContent) : null;
      }
      const api = {
        instanceId: instId,
        frames,
        goto: (t) => actions.jump(t),
        presenter,
        onResize: (cb) => resizeCallbacks.push(cb),
        palette: getComputedStyle(document.documentElement),
      };
      try {
        mounted[instId] = { ctl, inst: ctl.mount(el, data, api), el };
      } catch (err) {
        console.error(`lattice: mount failed for ${instId}`, err);
      }
    }
  }

  function applyStep(id, step, info) {
    const s = slide(id);
    const row = s.positions[step] || [];
    const posOf = {};
    s.tracks.forEach((t, i) => { posOf[t.instance || t.id] = row[i] || 0; });
    if ("reveal" in posOf) {
      const shown = posOf.reveal;
      for (const el of $$("[data-lt-reveal]", sections[id])) {
        el.classList.toggle("lt-hidden", Number(el.dataset.ltReveal) > shown);
      }
    }
    const prevRow = info.fromStep != null ? s.positions[info.fromStep] || [] : null;
    for (const instId of instancesBySlide[id] || []) {
      const m = mounted[instId];
      if (!m) continue;
      const tIndex = s.tracks.findIndex((t) => t.instance === instId);
      const pos = tIndex >= 0 ? row[tIndex] : 0;
      const from = prevRow && tIndex >= 0 ? prevRow[tIndex] : null;
      if (info.sameSlide && from === pos && !info.force) continue;
      try {
        m.ctl.show(m.inst, pos, { from, direction: from == null ? 0 : Math.sign(pos - from), animate: info.animate });
      } catch (err) {
        console.error(`lattice: show failed for ${instId}`, err);
      }
    }
  }

  function render(prev, how) {
    const id = nav.cur.slide;
    const sameSlide = prev && prev.slide === id;
    if (!sameSlide) {
      if (prev && prev.slide && sections[prev.slide]) {
        sections[prev.slide].hidden = true;
        sections[prev.slide].classList.remove("lt-current");
        for (const instId of instancesBySlide[prev.slide] || []) {
          const m = mounted[instId];
          if (m && m.ctl.leave) try { m.ctl.leave(m.inst); } catch (e) { console.error(e); }
        }
      }
      const sec = sections[id];
      sec.hidden = false;
      sec.classList.add("lt-current");
      mountSlide(id);
      for (const instId of instancesBySlide[id] || []) {
        const m = mounted[instId];
        if (m && m.ctl.enter) try { m.ctl.enter(m.inst); } catch (e) { console.error(e); }
      }
      const tr = transitionFor(how, id);
      sec.classList.remove(...Array.from(sec.classList).filter((c) => c.startsWith("lt-anim-")));
      if (tr && tr !== "none") {
        void sec.offsetWidth;
        sec.classList.add(`lt-anim-${tr}`);
      }
    }
    // scrubbing, previews and printing never animate (spec 10.1)
    const adjacent = sameSlide && Math.abs(prev.step - nav.cur.step) === 1 && !passive && !(how && how.kind === "scrub");
    applyStep(id, nav.cur.step, { sameSlide, fromStep: sameSlide ? prev.step : null, animate: adjacent, force: !sameSlide });
    updateHud();
    if (passive) return;
    updateHash();
    save();
    if (!how || how.kind !== "sync") broadcast();
    if (presenter) updatePresenter();
  }

  // ------------------------------------------------------------------ HUD
  function updateHud() {
    const crumbs = $("#lt-crumbs");
    const parts = nav.H.filter((e) => e.kind === "excursion").map((e) => esc(label(e.slide)));
    const d = detourOf(nav.cur.slide);
    if (!parts.length && d) parts.push(esc(label(d.origin)));
    parts.push(`<b>${esc(label(nav.cur.slide))}</b>`);
    crumbs.innerHTML = parts.join('<span class="lt-sep">\u21b3</span>');

    const s = slide(nav.cur.slide);
    const bits = [];
    if (s.steps > 14) bits.push(`<span class="lt-where">step ${nav.cur.step + 1}/${s.steps}</span>`);
    else if (s.steps > 1) {
      bits.push(`<span class="lt-steps">${Array.from({ length: s.steps }, (_, i) => `<i class="${i <= nav.cur.step ? "on" : ""}"></i>`).join("")}</span>`);
    }
    if (s.detours.length) bits.push(`<span class="lt-hint"><kbd>\u2193</kbd>${esc(deck.detours[s.detours[0]].label)}</span>`);
    if (topExcursion() >= 0 || d) bits.push(`<span class="lt-hint"><kbd>\u2191</kbd>${esc(label(returnTarget()))}</span>`);
    const mp = deck.mainPath.indexOf(nav.cur.slide);
    if (nav.tour) bits.push(`<span class="lt-where">tour ${esc(nav.tour)}</span>`);
    if (mp >= 0) bits.push(`<span class="lt-where">${mp + 1}/${deck.mainPath.length}</span>`);
    else if (d) bits.push(`<span class="lt-where">${d.slides.indexOf(nav.cur.slide) + 1}/${d.slides.length}</span>`);
    else if (s.offpath) bits.push(`<span class="lt-where">off path</span>`);
    $("#lt-progress").innerHTML = bits.join("");
  }

  function flash(message) {
    let el = $("#lt-flash");
    if (!el) {
      el = document.createElement("div");
      el.id = "lt-flash";
      $("#lt-viewport").appendChild(el);
    }
    el.textContent = message;
    el.classList.add("on");
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => el.classList.remove("on"), 1200);
    return false;
  }

  // ------------------------------------------------------------------ persistence (spec 7.4)
  function updateHash() {
    const h = `#/${encodeURIComponent(nav.cur.slide)}/${nav.cur.step}`;
    if (location.hash !== h) history.replaceState(null, "", h);
  }
  function save() {
    try { sessionStorage.setItem(storageKey, JSON.stringify(nav)); } catch (e) { /* storage unavailable */ }
  }
  function parseHash() {
    const m = /^#\/([^/]+)(?:\/(\d+))?$/.exec(location.hash);
    if (!m) return null;
    const id = resolveTarget(decodeURIComponent(m[1]));
    return id ? { slide: id, step: Math.min(Number(m[2] || 0), steps(id) - 1) } : null;
  }
  function restore() {
    const fromHash = parseHash();
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem(storageKey) || "null"); } catch (e) { saved = null; }
    const valid = (e) => e && deck.slides[e.slide];
    if (saved && valid(saved.cur) && (!fromHash || (fromHash.slide === saved.cur.slide && fromHash.step === saved.cur.step))) {
      saved.H = (saved.H || []).filter(valid);
      if (saved.tour && !deck.tours[saved.tour]) saved.tour = null;
      return saved;
    }
    return { cur: fromHash || { slide: deck.start, step: 0 }, H: [], tour: null };
  }

  // ------------------------------------------------------------------ sync (spec 7.5)
  function broadcast() {
    if (channel) channel.postMessage({ nav: JSON.parse(JSON.stringify(nav)) });
  }
  function onRemote(msg) {
    if (!msg || !msg.nav || !deck.slides[msg.nav.cur.slide]) return;
    const prev = Object.assign({}, nav.cur);
    nav = msg.nav;
    render(prev, { kind: "sync", dir: 0 });
  }

  // ------------------------------------------------------------------ overlays
  function closeOverlay() {
    const o = $("#lt-overlay");
    o.hidden = true;
    o.innerHTML = "";
  }
  const overlayOpen = () => !$("#lt-overlay").hidden;

  function slideButton(id, extra = "") {
    const cur = id === nav.cur.slide ? " current" : "";
    return `<button type="button" class="lt-ov-item${cur}" data-jump="${esc(id)}">${esc(label(id))}${extra}</button>`;
  }

  function openOverview() {
    const listed = new Set();
    const tree = (id, depth) => {
      listed.add(id);
      let out = `<li>${slideButton(id)}`;
      const s = slide(id);
      for (const dId of s.detours) {
        const d = deck.detours[dId];
        out += `<ul class="lt-ov-detour"><li class="lt-ov-label">${d.key ? `<kbd>${esc(d.key)}</kbd>` : "\u2193"} ${esc(d.label)}</li>`;
        for (const x of d.slides) out += tree(x, depth + 1);
        out += "</ul>";
      }
      if (s.branches.length) {
        out += `<ul class="lt-ov-branch">`;
        for (const b of s.branches) out += `<li class="lt-ov-label"><kbd>${esc(b.key)}</kbd> ${esc(b.label || label(b.target))}</li>`;
        out += "</ul>";
      }
      return out + "</li>";
    };
    let html = `<div class="lt-panel lt-overview"><h2>Overview</h2>${overviewMap()}<ol class="lt-ov-main">`;
    for (const id of deck.order) {
      const s = slide(id);
      if (s.scope !== "root" || s.offpath || listed.has(id)) continue;
      html += tree(id, 0);
    }
    html += "</ol>";
    const rest = deck.order.filter((id) => !listed.has(id));
    if (rest.length) html += `<h3>Off path</h3><ul class="lt-ov-rest">${rest.map((id) => `<li>${slideButton(id)}</li>`).join("")}</ul>`;
    html += "</div>";
    const o = $("#lt-overlay");
    o.innerHTML = html;
    o.hidden = false;
    const cur = $(".lt-ov-item.current", o);
    if (cur) cur.focus({ preventScroll: true });
    const node = $(".lt-ovn.current", o);
    if (node) node.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function overviewMap() {
    const ov = deck.overview;
    if (!ov || !ov.nodes || !Object.keys(ov.nodes).length) return "";
    const visited = new Set(nav.H.map((e) => e.slide));
    const edges = ov.edges.map((e) => `<path class="k-${e.kind}" d="${e.path}"${e.kind === "link" ? "" : ' marker-end="url(#lt-ov-arrow)"'}/>`).join("");
    const nodes = Object.entries(ov.nodes).map(([id, n]) => {
      const s = slide(id);
      const cls = ["lt-ovn", id === nav.cur.slide ? "current" : "", visited.has(id) ? "visited" : "",
        s.offpath ? "offpath" : "", s.scope !== "root" ? "detour" : ""].join(" ");
      return `<g class="${cls}" data-jump="${esc(id)}" transform="translate(${n.x - n.w / 2},${n.y - n.h / 2})">` +
        `<rect width="${n.w}" height="${n.h}" rx="7"/><text x="${n.w / 2}" y="${n.h / 2}">${esc(n.label)}</text></g>`;
    }).join("");
    return `<div class="lt-ov-map"><svg viewBox="0 0 ${ov.width} ${ov.height}" width="${ov.width * 1.15}" height="${ov.height * 1.15}">` +
      `<defs><marker id="lt-ov-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>` +
      `<g class="lt-ov-edges">${edges}</g>${nodes}</svg></div>`;
  }

  function fuzzy(q, text) {
    q = q.toLowerCase();
    text = text.toLowerCase();
    if (text.includes(q)) return 2;
    let i = 0;
    for (const c of text) if (c === q[i]) i++;
    return i === q.length ? 1 : 0;
  }

  function openGoto() {
    const o = $("#lt-overlay");
    o.innerHTML = `<div class="lt-panel lt-goto"><input type="text" placeholder="Go to slide" aria-label="Go to slide"><ul></ul></div>`;
    o.hidden = false;
    const input = $("input", o);
    const list = $("ul", o);
    let sel = 0;
    let matches = [];
    const refresh = () => {
      const q = input.value.trim();
      matches = deck.order
        .map((id) => ({ id, score: q ? Math.max(fuzzy(q, label(id)), fuzzy(q, id)) : 1 }))
        .filter((m) => m.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 12);
      sel = Math.min(sel, Math.max(0, matches.length - 1));
      list.innerHTML = matches
        .map((m, i) => `<li class="${i === sel ? "sel" : ""}"><button type="button" data-jump="${esc(m.id)}">${esc(label(m.id))}<small>${esc(m.id)}</small></button></li>`)
        .join("");
    };
    input.addEventListener("input", () => { sel = 0; refresh(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { sel = Math.min(sel + 1, matches.length - 1); refresh(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); refresh(); e.preventDefault(); }
      else if (e.key === "Enter" && matches[sel]) { const t = matches[sel].id; closeOverlay(); actions.jump(t); }
      else if (e.key === "Escape") closeOverlay();
      e.stopPropagation();
    });
    refresh();
    input.focus();
  }

  // ------------------------------------------------------------------ presenter view (spec 7.5)
  function buildPresenter() {
    const panel = $("#lt-presenter-panel");
    const W = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lt-w"));
    const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lt-h"));
    panel.innerHTML = `
      <div class="lt-pp-top"><span class="lt-pp-timer" title="Click to reset">00:00</span><span class="lt-pp-where"></span></div>
      <div class="lt-pp-scrub" hidden><input type="range" min="0" max="1" step="1" value="0" aria-label="Step of the current slide"><span class="lt-pp-scrub-label"></span></div>
      <h3>Next <span class="lt-pp-next-label"></span></h3>
      <div class="lt-pp-next"><iframe class="lt-pp-preview" title="Next" tabindex="-1" style="aspect-ratio:${W} / ${H}"></iframe><div class="lt-pp-next-none" hidden></div></div>
      <h3>Moves</h3><ul class="lt-pp-moves"></ul>
      <h3>Notes</h3><div class="lt-pp-notes"></div>`;
    const range = $(".lt-pp-scrub input", panel);
    range.addEventListener("input", () => {
      const i = Number(range.value);
      if (i !== nav.cur.step) go(nav.cur.slide, i, { kind: "scrub", dir: 0 });
    });
    range.addEventListener("change", () => range.blur()); // arrow keys go back to the deck
    previewFrame = $(".lt-pp-preview", panel);
    window.addEventListener("message", (e) => {
      if (e.source === previewFrame.contentWindow && e.data && e.data.lattice === "preview-ready") {
        previewReady = true;
        updatePreview();
      }
    });
    previewFrame.src = location.pathname + "?preview";
  }

  // What NEXT would show: the next step of this slide, else the slide NEXT moves to, at the step it lands on.
  function previewTarget() {
    const s = slide(nav.cur.slide);
    if (nav.cur.step < s.steps - 1) return { slide: nav.cur.slide, step: nav.cur.step + 1, label: `step ${nav.cur.step + 2} of ${s.steps}` };
    const nt = nextTarget();
    if (!nt || !nt.slide) return { slide: null, label: s.branches.length ? "choose a branch" : "end of path" };
    if (nt.kind === "back") {
      const i = topExcursion();
      return { slide: nt.slide, step: i >= 0 ? nav.H[i].step : steps(nt.slide) - 1, label: `return to ${label(nt.slide)}` };
    }
    return { slide: nt.slide, step: 0, label: label(nt.slide) };
  }

  function updatePreview() {
    if (!previewFrame) return;
    const t = previewTarget();
    $(".lt-pp-next-label").textContent = t.label ? `\u00b7 ${t.label}` : "";
    const none = $(".lt-pp-next-none");
    none.hidden = !!t.slide;
    none.textContent = t.slide ? "" : t.label;
    previewFrame.style.visibility = t.slide ? "visible" : "hidden";
    if (previewReady && t.slide) previewFrame.contentWindow.postMessage({ lattice: "preview", slide: t.slide, step: t.step }, "*");
  }

  function updatePresenter() {
    const panel = $("#lt-presenter-panel");
    const s = slide(nav.cur.slide);
    const nt = nextTarget();
    const moves = [];
    if (nav.cur.step < s.steps - 1) moves.push(`<li><kbd>\u2192</kbd> step ${nav.cur.step + 2} of ${s.steps}</li>`);
    else if (nt && nt.slide) moves.push(`<li><kbd>\u2192</kbd> ${nt.kind === "back" ? "return to " : ""}${esc(label(nt.slide))}</li>`);
    else moves.push(`<li><kbd>\u2192</kbd> end of path</li>`);
    for (const b of s.branches) moves.push(`<li><kbd>${esc(b.key)}</kbd> ${esc(b.label || label(b.target))}</li>`);
    s.detours.forEach((dId, i) => {
      const d = deck.detours[dId];
      moves.push(`<li><kbd>${esc(d.key || (i === 0 ? "\u2193" : "?"))}</kbd> detour: ${esc(d.label)}</li>`);
    });
    const rt = returnTarget();
    if (rt && (topExcursion() >= 0 || detourOf(nav.cur.slide))) moves.push(`<li><kbd>\u2191</kbd> return to ${esc(label(rt))}</li>`);
    $(".lt-pp-where", panel).textContent = `${s.label} \u00b7 step ${nav.cur.step + 1}/${s.steps}`;
    const scrub = $(".lt-pp-scrub", panel);
    scrub.hidden = s.steps < 2;
    const range = $("input", scrub);
    range.max = String(Math.max(1, s.steps - 1));
    range.value = String(nav.cur.step);
    $(".lt-pp-scrub-label", scrub).textContent = `${nav.cur.step + 1} / ${s.steps}`;
    $(".lt-pp-moves", panel).innerHTML = moves.join("");
    const notes = $(".lt-pp-notes", panel);
    notes.innerHTML = s.notes || "<p class=\"lt-muted\">No notes for this slide.</p>";
    renderMath(notes);
    updatePreview();
    tickTimer();
  }
  function tickTimer() {
    const el = $(".lt-pp-timer");
    if (!el) return;
    const secs = Math.floor((Date.now() - timerStart) / 1000);
    el.textContent = `${String(Math.floor(secs / 60)).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")}`;
  }

  function renderMath(root) {
    if (!window.katex) return;
    for (const el of $$(".lt-math", root)) {
      if (el.dataset.done) continue;
      try {
        window.katex.render(el.textContent, el, { displayMode: el.dataset.display === "1", throwOnError: false });
        el.dataset.done = "1";
      } catch (e) { console.error(e); }
    }
  }

  // ------------------------------------------------------------------ print (spec 11.5)
  // Each page of the plan is rendered, then its slide is copied into a static page. Chromium prints
  // the copies in one pass, so links between pages become links inside the PDF.
  const nextFrame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function renameIds(root, suffix) {
    const ids = new Map();
    for (const el of [root, ...$$("[id]", root)]) {
      if (!el.id) continue;
      ids.set(el.id, el.id + suffix);
      el.id += suffix;
    }
    const fix = (v) => v.replace(/url\(\s*(['"]?)#([^)'"]+)\1\s*\)/g, (m, q, id) => (ids.has(id) ? `url(#${ids.get(id)})` : m));
    for (const el of [root, ...$$("*", root)]) {
      for (const a of Array.from(el.attributes)) {
        if (!a.value.includes("#")) continue;
        let v = fix(a.value);
        if ((a.name === "href" || a.name === "xlink:href") && v.startsWith("#") && ids.has(v.slice(1))) v = `#${ids.get(v.slice(1))}`;
        if (v !== a.value) el.setAttribute(a.name, v);
      }
    }
  }

  function pageLink(el, page, extra) {
    const a = document.createElement("a");
    for (const at of Array.from(el.attributes)) if (!at.name.startsWith("data-") && at.name !== "type") a.setAttribute(at.name, at.value);
    a.innerHTML = el.innerHTML + (extra || "");
    if (page) a.href = `#lt-page-${page}`;
    else a.classList.add("lt-print-nolink");
    el.replaceWith(a);
  }

  function snapshot(entry, plan) {
    const sec = sections[entry.slide];
    const clone = sec.cloneNode(true);
    clone.hidden = false;
    clone.classList.remove(...Array.from(clone.classList).filter((c) => c.startsWith("lt-anim-")));
    const src = $$("canvas", sec);
    $$("canvas", clone).forEach((c, i) => {
      try {
        const img = document.createElement("img");
        img.src = src[i].toDataURL("image/png");
        img.style.cssText = c.style.cssText;
        img.style.width = `${src[i].clientWidth}px`;
        img.style.height = `${src[i].clientHeight}px`;
        c.replaceWith(img);
      } catch (e) { console.error(e); }
    });
    renameIds(clone, `-p${entry.n}`);
    const ref = (page) => (page ? `<span class="lt-print-ref">p.\u00a0${page}</span>` : "");
    for (const a of $$("a[data-lt-link]", clone)) {
      const t = resolveTarget(a.dataset.ltLink);
      const page = t && plan.pageOf[t];
      if (page) a.setAttribute("href", `#lt-page-${page}`);
      else { a.removeAttribute("href"); a.classList.add("lt-print-nolink"); }
    }
    for (const b of $$("[data-lt-detour]", clone)) {
      const d = deck.detours[b.dataset.ltDetour];
      const page = d && plan.pageOf[d.entry];
      pageLink(b, page, ref(page));
    }
    const s = slide(entry.slide);
    for (const b of $$("[data-lt-choose]", clone)) {
      const opt = s.branches.find((o) => o.key === b.dataset.ltChoose);
      const page = opt && plan.pageOf[opt.target];
      pageLink(b, page, ref(page));
    }
    const page = document.createElement("div");
    page.className = "lt-print-page";
    page.id = `lt-page-${entry.n}`;
    page.appendChild(clone);
    const sec2 = entry.section != null ? plan.sections[entry.section] : null;
    let where = esc(plan.title);
    if (sec2) {
      where = `Appendix ${esc(sec2.code)} \u00b7 ${esc(sec2.title)}`;
      if (entry.from) where += ` \u00b7 <a href="#lt-page-${entry.from}">from p.\u00a0${entry.from}</a>`;
    }
    const stepInfo = s.steps > 1 ? ` \u00b7 step ${entry.step + 1}/${s.steps}` : "";
    page.insertAdjacentHTML("beforeend",
      `<div class="lt-print-foot"><span>${where}</span><span>${esc(s.label)}${stepInfo}<b>${entry.n}</b></span></div>`);
    return page;
  }

  async function print(plan) {
    const holder = document.createElement("div");
    holder.id = "lt-print-pages";
    document.body.appendChild(holder);
    for (const entry of plan.pages) {
      const prev = Object.assign({}, nav.cur);
      nav.cur = { slide: entry.slide, step: Math.max(0, Math.min(entry.step, steps(entry.slide) - 1)) };
      render(prev, { kind: "sync", dir: 0 });
      await nextFrame();
      if (prev.slide !== entry.slide && (instancesBySlide[entry.slide] || []).length) await sleep(120); // async renderers (Vega)
      holder.appendChild(snapshot(entry, plan));
    }
    $("#lt-root").hidden = true;
    document.documentElement.classList.add("lt-printed");
    return plan.pages.length;
  }

  // ------------------------------------------------------------------ input
  function keyMap() {
    const m = {};
    for (const [action, keys] of Object.entries(deck.keys)) for (const k of keys) m[k] = action;
    return m;
  }

  function onKey(e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && e.target.closest && e.target.closest("input, textarea, select")) return;
    if (overlayOpen()) {
      if (e.key === "Escape" || (e.key === "o" && $(".lt-overview"))) { closeOverlay(); e.preventDefault(); }
      return;
    }
    const s = slide(nav.cur.slide);
    const slideKey = s.branches.some((b) => b.key === e.key) || s.detours.some((d) => deck.detours[d].key === e.key);
    if (slideKey) { actions.choose(e.key); e.preventDefault(); return; }
    const action = keyMap()[e.key];
    if (action && actions[action]) { actions[action](); e.preventDefault(); }
  }

  function onClick(e) {
    const jump = e.target.closest("[data-jump]");
    if (jump) { e.preventDefault(); closeOverlay(); actions.jump(jump.dataset.jump); return; }
    const link = e.target.closest("[data-lt-link]");
    if (link) { e.preventDefault(); actions.jump(link.dataset.ltLink); return; }
    const choose = e.target.closest("[data-lt-choose]");
    if (choose) { e.preventDefault(); actions.choose(choose.dataset.ltChoose); return; }
    const detour = e.target.closest("[data-lt-detour]");
    if (detour) { e.preventDefault(); actions.enter(detour.dataset.ltDetour); return; }
    if (e.target.closest(".lt-pp-timer")) { timerStart = Date.now(); tickTimer(); return; }
    if (e.target.id === "lt-overlay") closeOverlay();
  }

  // ------------------------------------------------------------------ layout
  function fit() {
    const stage = $("#lt-stage");
    const vp = $("#lt-viewport");
    const W = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lt-w"));
    const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lt-h"));
    const r = stage.getBoundingClientRect();
    const scale = Math.min(r.width / W, r.height / H);
    vp.style.transform = `translate(${(r.width - W * scale) / 2}px, ${(r.height - H * scale) / 2}px) scale(${scale})`;
    for (const cb of resizeCallbacks) try { cb(scale); } catch (e) { console.error(e); }
  }

  // ------------------------------------------------------------------ boot
  async function loadData() {
    const pending = Object.entries(deck.instances).filter(([, m]) => m.url);
    await Promise.all(pending.map(async ([id, m]) => {
      try {
        const r = await fetch(m.url);
        dataStore[id] = await r.json();
      } catch (err) {
        console.error(`lattice: cannot load ${m.url} (directory output must be served over HTTP)`, err);
      }
    }));
  }

  function bootPassive() {
    // A passive window renders what it is told: the presenter's preview pane, or the PDF export.
    nav = { cur: { slide: deck.start, step: 0 }, H: [], tour: null };
    fit();
    render(null, { kind: "sync", dir: 0 });
    if (printing) return;
    window.addEventListener("message", (e) => {
      const m = e.data;
      if (e.source !== window.parent || !m || m.lattice !== "preview" || !deck.slides[m.slide]) return;
      const prev = Object.assign({}, nav.cur);
      nav.cur = { slide: m.slide, step: Math.max(0, Math.min(m.step || 0, steps(m.slide) - 1)) };
      render(prev, { kind: "sync", dir: 0 });
    });
    if (window.parent !== window) window.parent.postMessage({ lattice: "preview-ready" }, "*");
  }

  async function boot() {
    deck = JSON.parse($("#lt-deck").textContent);
    await loadData();
    const params = new URLSearchParams(location.search);
    printing = params.has("print");
    passive = printing || params.has("preview");
    presenter = !passive && params.has("presenter");
    storageKey = `lattice:${deck.hash}:nav`;
    for (const sec of $$(".lt-slide")) sections[sec.dataset.slide] = sec;
    for (const [id, inst] of Object.entries(deck.instances)) (instancesBySlide[inst.slide] ||= []).push(id);
    renderMath(document);
    window.addEventListener("resize", fit);
    window.addEventListener("pagehide", () => {
      for (const m of Object.values(mounted)) {
        if (m.ctl.destroy) try { m.ctl.destroy(m.inst); } catch (e) { console.error(e); }
      }
    });
    if (passive) {
      document.documentElement.classList.add(printing ? "lt-print" : "lt-preview");
      bootPassive();
      document.documentElement.classList.add("lt-ready");
      return;
    }
    if (presenter) {
      document.body.classList.add("lt-presenter");
      $("#lt-presenter-panel").hidden = false;
      buildPresenter();
      setInterval(tickTimer, 1000);
    }
    nav = restore();
    document.addEventListener("keydown", onKey);
    document.addEventListener("click", onClick);
    window.addEventListener("hashchange", () => {
      const h = parseHash();
      if (h && (h.slide !== nav.cur.slide || h.step !== nav.cur.step)) {
        if (h.slide === nav.cur.slide) go(h.slide, h.step, { kind: "step", dir: 0 });
        else { push("excursion"); go(h.slide, h.step, { kind: "link", dir: 1 }); }
      }
    });
    if ("BroadcastChannel" in window) {
      channel = new BroadcastChannel(`lattice:${deck.hash}`);
      channel.onmessage = (e) => onRemote(e.data);
    }
    fit();
    render(null, { kind: "sync", dir: 0 });
    document.documentElement.classList.add("lt-ready");
  }

  return { component, boot, frames, applyDelta, renderPanel, esc, print, actions: () => actions, state: () => nav };
})();
window.Lattice = Lattice;

// Line highlighting for `code` (as a follower) and `code-steps`.
(() => {
  const controller = {
    mount(el, data) {
      const box = el.querySelector(".lt-code");
      const lines = new Map(Array.from(el.querySelectorAll(".lt-line")).map((l) => [Number(l.dataset.line), l]));
      return { box, lines, steps: (data && data.steps) || [[]], pre: el.querySelector("pre") };
    },
    show(inst, position) {
      const hl = new Set(inst.steps[position] || []);
      let first = null;
      for (const [n, line] of inst.lines) {
        const on = hl.has(n);
        line.classList.toggle("lt-hl", on);
        if (on && !first) first = line;
      }
      inst.box.classList.toggle("lt-has-hl", hl.size > 0);
      if (first && inst.pre.scrollHeight > inst.pre.clientHeight) {
        inst.pre.scrollTo({ top: first.offsetTop - inst.pre.clientHeight / 3, behavior: "smooth" });
      }
    },
  };
  Lattice.component("code", controller);
  Lattice.component("code-steps", controller);
})();

Lattice.boot();
</script>
</body>
